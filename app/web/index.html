<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Nightlight</title>
    <link rel="stylesheet" href="/static/style.css" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <main>
      <header>
        <h1>Ночник</h1>
        <span id="connStatus" class="conn-dot" title="Статус подключения"></span>
      </header>

      <!-- Визуальный эмулятор LED — круг с подсветкой, яркость меняется в реальном времени -->
      <div class="lamp-wrap">
        <div id="lamp" class="lamp"></div>
        <span id="lampLabel" class="lamp-label">—</span>
      </div>

      <section class="controls">
        <div class="slider-header">
          <span>Яркость</span>
          <span id="brightnessValue">0%</span>
        </div>
        <input id="brightness" type="range" min="0" max="100" value="0" />

        <div class="btn-row">
          <button id="btnOn" class="btn btn-on">Включить</button>
          <button id="btnOff" class="btn btn-off">Выключить</button>
        </div>
        <button id="refresh" class="btn btn-secondary">Обновить</button>
      </section>

      <details class="panel">
        <summary>Настройки</summary>
        <div class="panel-body">
          <label for="token">API токен</label>
          <input id="token" type="password" autocomplete="off" placeholder="Введите токен" />
          <button id="saveToken" class="btn btn-secondary">Сохранить</button>
        </div>
      </details>

      <details class="panel">
        <summary>Отладка</summary>
        <pre id="status" class="status-pre">—</pre>
      </details>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
